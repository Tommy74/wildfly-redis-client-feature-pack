name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [17, 21]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build with Maven
        run: mvn --batch-mode --no-transfer-progress clean install -DskipTests

      - name: Run unit tests
        run: mvn --batch-mode --no-transfer-progress test -pl redis-client/subsystem

  integration-tests:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        java: [17]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build project
        run: mvn --batch-mode --no-transfer-progress clean install -DskipTests

      - name: Run integration tests
        run: mvn --batch-mode --no-transfer-progress verify -pl redis-client-testsuite
